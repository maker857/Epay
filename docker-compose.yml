services:
  db:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - epay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - epay

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DRIVER: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_PREFIX: ${DB_PREFIX:-pay}
      ADMIN_USER: ${ADMIN_USER:?Set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_PAY_PASSWORD: ${ADMIN_PAY_PASSWORD:?Set ADMIN_PAY_PASSWORD in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:80"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /var/run/apache2:rw,noexec,nosuid,nodev
      - /var/lock/apache2:rw,noexec,nosuid,nodev
      - /var/log/apache2:rw,noexec,nosuid,nodev
      - /var/cache/apache2:rw,noexec,nosuid,nodev
      - /var/lib/php/sessions:rw,noexec,nosuid,nodev,uid=33,gid=33,mode=1733
    volumes:
      - epay-uploads:/var/www/html/assets/uploads
      - epay-plugin-logs:/var/www/html/plugins/sandpay/logs
    networks:
      - epay

volumes:
  epay-postgres:
  epay-uploads:
  epay-plugin-logs:

networks:
  epay:
